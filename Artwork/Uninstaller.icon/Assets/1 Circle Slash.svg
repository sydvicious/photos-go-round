    <circle cx="730" cy="730" r="190" stroke="#ffffff" stroke-width="84"/>
    <line x1="596" y1="596" x2="864" y2="864" stroke="#ffffff" stroke-width="84"/>
    <circle cx="730" cy="730" r="190" stroke="#e0282e" stroke-width="56"/>
    <line x1="596" y1="596" x2="864" y2="864" stroke="#e0282e" stroke-width="56"/>
  </g>
</svg>
